<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Rental Management Dashboard</title>

        <!-- Import global typography: Inter (English/Numbers) and Noto Sans Thai -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />

        <!-- Import Font Awesome for UI icons -->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        />

        <!-- Link modular CSS files -->
        <link rel="stylesheet" href="./css/main.css" />
        <link rel="stylesheet" href="./css/grid.css" />
    </head>
    <body>
        <!-- Main Application Shell -->
        <div class="app-container">
            <!-- Header Section -->
            <header class="app-header">
                <div class="header-brand">
                    <i class="fa-solid fa-building"></i>
                    <h1>Property Dashboard</h1>
                </div>
                <div class="header-actions">
                    <span class="admin-badge"
                        ><i class="fa-solid fa-user-shield"></i> Admin</span
                    >
                </div>
            </header>

            <!-- Main Content Area -->
            <main class="app-content">
                <section class="dashboard-controls">
                    <h2>Visual Room Layout</h2>
                    <div class="status-legend">
                        <span class="legend-item"
                            ><span class="color-dot vacant"></span> Vacant</span
                        >
                        <span class="legend-item"
                            ><span class="color-dot occupied"></span>
                            Occupied</span
                        >
                        <span class="legend-item"
                            ><span class="color-dot overdue"></span>
                            Overdue</span
                        >
                        <span class="legend-item"
                            ><span class="color-dot maintenance"></span>
                            Maintenance</span
                        >
                    </div>
                </section>

                <!-- 
                This container will be dynamically populated with room blocks 
                by the JavaScript module (roomFeature.js) 
            -->
                <div id="room-grid-container" class="room-grid">
                    <!-- Room items will be injected here -->
                </div>
            </main>
        </div>

        <!-- Room Details Modal (Step 4.1) -->
        <div id="room-modal" class="modal-overlay hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="modal-room-title">Room Details</h3>
                    <button id="close-modal-btn" class="close-btn">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div class="modal-body">
                    <!-- Update Status Form -->
                    <form id="update-status-form">
                        <input type="hidden" id="modal-room-id" />
                        <div class="form-group">
                            <label for="room-status-select">Room Status</label>
                            <select
                                id="room-status-select"
                                class="form-control"
                            >
                                <option value="vacant">Vacant</option>
                                <option value="occupied">Occupied</option>
                                <option value="overdue">Overdue</option>
                                <option value="maintenance">Maintenance</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-primary">
                            Update Status
                        </button>
                    </form>

                    <!-- Divider -->
                    <hr
                        style="
                            margin: 1.5rem 0;
                            border: 0;
                            border-top: 1px solid var(--color-border);
                        "
                    />

                    <!-- Tenant Management Section (Step 4.2) -->
                    <div id="tenant-section-container">
                        <!-- Tenant info or Check-in form will be injected here via JS -->
                    </div>

                    <!-- Divider -->
                    <hr
                        style="
                            margin: 1.5rem 0;
                            border: 0;
                            border-top: 1px solid var(--color-border);
                        "
                    />

                    <!-- Billing Management Section (Step 4.3) -->
                    <div id="billing-section-container">
                        <!-- Billing form and unpaid bills list will be injected here via JS -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Entry point for application logic -->
        <script type="module" src="./js/app.js"></script>
    </body>
</html>
